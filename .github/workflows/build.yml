name: Build open data
# No schedule: runs when started by hand, by the Saeed TV status page, or when the build script changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/build.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build channels from Wikidata
        # A failed or thin answer keeps the committed file, so the published data never goes empty.
        continue-on-error: true
        run: python3 -I scripts/build_channels.py
      - name: Build free-to-air TV lists from iptv-org
        # Same rule: a thin run keeps the committed lists.
        continue-on-error: true
        timeout-minutes: 15
        run: python3 -I scripts/build_tv.py
      - name: Commit refreshed data
        run: |
          git config user.name "saeedtv-open-data"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || { git commit -m "data: refresh $(date -u +%F)" && git push; }
      - name: Prepare site
        run: |
          mkdir -p _site && cp -r data _site/ && cp README.md _site/
          printf '<!doctype html><meta charset="utf-8"><title>Saeed TV open data</title><p><a href="data/youtube-channels.json">data/youtube-channels.json</a></p><p><a href="data/tv/index.json">data/tv/index.json</a></p>' > _site/index.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
